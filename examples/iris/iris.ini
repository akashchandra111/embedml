# Iris example: 4 features -> 8 ReLU -> 3 softmax.
[data]
csv = iris.csv
inputs = sepal_length,sepal_width,petal_length,petal_width
outputs = species
has_header = true
split = 0.8
seed = 42

[model]
layers = 10
activations = relu,softmax
loss = cce

[train]
epochs = 500
batch = 10
optimizer = adam
lr = 0.01
l2 = 0.0001
early_stop = 50
threads = 5

[export]
out = iris.elml
